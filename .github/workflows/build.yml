name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build src/Backdrop/Backdrop.csproj -c Release --warnaserror

      - name: Publish
        run: dotnet publish src/Backdrop/Backdrop.csproj -c Release -r win-x64 -o dist --self-contained false

      - uses: actions/upload-artifact@v4
        with:
          name: backdrop-win-x64
          path: dist/
