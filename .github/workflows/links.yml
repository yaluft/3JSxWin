name: links

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Check links weekly on Monday at 08:00 UTC
    - cron: "0 8 * * 1"

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --verbose
            --no-progress
            --exclude "localhost"
            --exclude "^mailto:"
            --exclude "plausible.io"
            '**/*.md'
            '**/*.yml'
          fail: true
